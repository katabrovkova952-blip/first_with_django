{% extends "base.html" %}

{% block title %}Видалити книгу{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">
                <h4 class="card-title mb-3">Видалити книгу?</h4>
                <p class="text-muted">
                    Ви впевнені, що хочете видалити «<strong>{{ book.title }}</strong>»?
                    Цю дію не можна скасувати.
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Так, видалити</button>
                    <a href="{% url 'books:home' %}" class="btn btn-secondary">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
