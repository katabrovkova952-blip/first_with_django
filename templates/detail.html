{% extends "base.html" %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">{{ book.title }}</h2>
                <h6 class="card-subtitle mb-3 text-muted">{{ book.author }}</h6>

                <p class="mb-1"><strong>Рік:</strong> {{ book.year }}</p>

                <hr>

                <p class="card-text">{{ book.description }}</p>

                <div class="mt-4">
                    <a href="{% url 'books:home' %}" class="btn btn-secondary btn-sm">← Назад</a>
                    <a href="{% url 'books:update' book.pk %}" class="btn btn-warning btn-sm">Редагувати</a>
                    <a href="{% url 'books:delete' book.pk %}" class="btn btn-danger btn-sm">Видалити</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
