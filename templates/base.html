<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Мій сайт{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg" style="background-color: #e3f2fd;">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'books:home' %}">Бібліотека</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'books:home' %}">Магазин</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'books:create' %}">Додати книгу</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                {{ user.username }}
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{% url 'profile' %}">Мій профіль</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <form method="POST" action="{% url 'logout' %}" class="px-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link dropdown-item">Вийти</button>
                  </form>
                </li>
              </ul>
            </li>
          </ul>
          <form class="d-flex" role="search" method="get" action="{% url 'books:home' %}">
            <input class="form-control me-2" type="search" name="search" placeholder="Пошук" aria-label="Search" value="{{ search }}">
            <button class="btn btn-outline-success" type="submit">Пошук</button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container my-4">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
