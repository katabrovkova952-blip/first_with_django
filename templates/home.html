{% extends 'base.html' %}

{% block content %}
<form method="get">
    <input
        type="text"
        name="search"
        placeholder="Пошук..."
        value="{{ search|default:'' }}"
    >

    <button type="submit">🔍</button>
</form>

<hr>
{% for book in books %}
    <div>
        <h2>
            <a href="{% url 'book_detail' book.id %}">
                {{ book.title }}
            </a>
        </h2>

        <p>{{ book.author }}</p>

        <a href="{% url 'edit_book' book.id %}">✏️</a>

        <form method="POST" action="{% url 'delete_book' book.id %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">❌</button>
        </form>
    </div>

    <hr>
{% empty %}

{% if search %}
        <h3>😔 За запитом "<strong>{{ search }}</strong>" нічого не знайдено.</h3>
    {% else %}
        <h3>📚 У вас поки немає книг.</h3>
    {% endif %}

{% endfor %}

{% endblock %}
